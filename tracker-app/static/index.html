<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bewerbungen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17181c);
    --bg2: var(--tg-theme-secondary-bg-color, #232630);
    --text: var(--tg-theme-text-color, #f2f2f4);
    --hint: var(--tg-theme-hint-color, #8b8f9a);
    --accent: var(--tg-theme-button-color, #5a9cf0);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #4caf7d;
    --bad: #d96a6a;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    overscroll-behavior: none;
  }

  header { padding: 14px 16px 10px; }
  header h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }

  /* ---------- Ansicht-Umschalter ---------- */
  .views {
    display: flex; gap: 6px; padding: 0 16px 12px;
  }
  .views button {
    flex: 1; border: none; background: var(--bg2); color: var(--hint);
    font: inherit; font-size: 13.5px; font-weight: 700;
    padding: 9px 0; border-radius: 11px; cursor: pointer;
  }
  .views button.active { background: var(--accent); color: var(--accent-text); }

  /* ---------- Suche (Tracker) ---------- */
  .search { padding: 0 16px 10px; }
  .search input {
    width: 100%; border: none; background: var(--bg2); color: var(--text);
    font: inherit; padding: 10px 13px; border-radius: 11px; outline: none;
  }
  .search input:focus { outline: 2px solid var(--accent); }
  .search input::placeholder { color: var(--hint); }

  /* ---------- Status-Tabs ---------- */
  nav {
    display: flex; gap: 6px; padding: 0 16px 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex-shrink: 0; border: none; background: var(--bg2); color: var(--hint);
    font: inherit; font-size: 13.5px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  nav button.active { background: var(--accent); color: var(--accent-text); }
  nav button .n { opacity: 0.75; font-weight: 500; margin-left: 4px; }

  /* ---------- Karten (Liste) ---------- */
  main { padding: 0 16px 90px; }
  .card {
    background: var(--bg2); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .firma { font-weight: 700; font-size: 15.5px; }
  .card .datum { color: var(--hint); font-size: 12.5px; white-space: nowrap; }
  .card .sub { color: var(--hint); font-size: 13.5px; margin-top: 3px; }
  .card .notiz {
    font-size: 13px; margin-top: 7px; opacity: 0.85;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card.zusage { box-shadow: inset 3px 0 0 var(--ok); }
  .card.absage { box-shadow: inset 3px 0 0 var(--bad); opacity: 0.7; }
  .card.gemerkt { box-shadow: inset 3px 0 0 var(--hint); }

  .empty {
    text-align: center; color: var(--hint);
    padding: 50px 20px; font-size: 14px; line-height: 1.6;
  }

  /* ---------- Jobsuche ---------- */
  #jobsWrap { display: none; padding: 0 16px 90px; }
  #jobsWrap.show { display: block; }
  .job-search { display: flex; gap: 8px; margin-bottom: 12px; }
  .job-search input {
    border: none; background: var(--bg2); color: var(--text);
    font: inherit; padding: 10px 13px; border-radius: 11px; outline: none; min-width: 0;
  }
  .job-search input:focus { outline: 2px solid var(--accent); }
  .job-search input::placeholder { color: var(--hint); }
  #jobQ { flex: 1.5; }
  #jobOrt { flex: 1; }
  .job-search button {
    border: none; background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 700; padding: 10px 15px; border-radius: 11px; cursor: pointer;
    flex-shrink: 0;
  }
  .jobcard {
    background: var(--bg2); border-radius: var(--radius);
    padding: 13px 14px; margin-bottom: 10px;
  }
  .jobcard .titel { font-weight: 700; font-size: 15px; }
  .jobcard .sub { color: var(--hint); font-size: 13.5px; margin-top: 3px; }
  .jobcard .row { display: flex; gap: 8px; margin-top: 10px; }
  .jobcard .row a, .jobcard .row button {
    border: none; font: inherit; font-size: 13px; font-weight: 700;
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    text-decoration: none; text-align: center;
  }
  .jobcard .ansehen { background: transparent; color: var(--accent); border: 1.5px solid var(--accent) !important; }
  .jobcard .merken { background: var(--accent); color: var(--accent-text); }
  .jobcard .merken:disabled { opacity: 0.5; }
  .jobcard .quelle {
    font-size: 11.5px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .quellen-status {
    color: var(--hint); font-size: 12px; margin-bottom: 10px; text-align: center;
  }
  .beruf-chips { margin-bottom: 12px; }

  .deep-btn {
    width: 100%; border: none; margin-top: 4px; margin-bottom: 12px;
    background: transparent; color: var(--accent);
    border: 1.5px dashed var(--accent); font: inherit; font-size: 13.5px;
    font-weight: 700; padding: 11px; border-radius: 12px; cursor: pointer;
  }
  .deep-btn:disabled { opacity: 0.5; }

  #profilWrap { display: none; padding: 0 16px 90px; }
  #profilWrap.show { display: block; }
  .profil-box {
    background: var(--bg2); border-radius: var(--radius);
    padding: 15px; margin-bottom: 12px;
  }
  .profil-box h3 { font-size: 15.5px; margin-bottom: 8px; }
  .profil-hint { color: var(--hint); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .btn-upload {
    width: 100%; border: none; background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 700; padding: 12px; border-radius: 11px; cursor: pointer;
  }
  .btn-upload:disabled { opacity: 0.5; }
  .profil-status { color: var(--hint); font-size: 12.5px; margin-top: 9px; text-align: center; }
  .analyse-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }

  .detail-sub { color: var(--hint); font-size: 13.5px; margin-bottom: 12px; }
  .detail-text {
    font-size: 14px; line-height: 1.55; white-space: pre-wrap;
    background: var(--bg2); border-radius: 12px; padding: 13px; margin-bottom: 14px;
  }
  .detail-actions { display: flex; flex-direction: column; gap: 8px; }
  .detail-actions a, .detail-actions button {
    border: none; font: inherit; font-weight: 700; font-size: 14px;
    padding: 13px; border-radius: 12px; cursor: pointer;
    text-align: center; text-decoration: none;
  }
  .da-bewerben { background: var(--ok); color: #fff; }
  .da-ansehen { background: var(--bg2); color: var(--accent); }
  .da-merken { background: var(--accent); color: var(--accent-text); }
  .da-merken:disabled { opacity: 0.5; }

  /* ---------- Karte (Map) ---------- */
  #mapWrap { display: none; padding: 0 16px 90px; }
  #mapWrap.show { display: block; }
  .map-modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .map-modes button {
    flex: 1; border: none; background: var(--bg2); color: var(--hint);
    font: inherit; font-size: 13px; font-weight: 700;
    padding: 8px 0; border-radius: 10px; cursor: pointer;
  }
  .map-modes button.active { background: var(--accent); color: var(--accent-text); }
  #mapJobSearch { margin-bottom: 10px; }
  .popup-merken {
    display: inline-block; margin-top: 6px; border: none;
    background: var(--accent, #5a9cf0); color: #fff;
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  #map { height: 62vh; border-radius: var(--radius); background: var(--bg2); }
  .map-hint { color: var(--hint); font-size: 12.5px; margin-top: 8px; text-align: center; }
  .leaflet-popup-content { font-family: inherit; font-size: 13.5px; }
  .leaflet-popup-content b { font-size: 14.5px; }

  /* ---------- Plus-Button ---------- */
  .fab {
    position: fixed; right: 18px; bottom: 22px;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    border: none; font-size: 26px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Sheet ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; }
  .overlay.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.22s ease;
    max-height: 88vh; overflow-y: auto;
  }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet h2 { font-size: 17px; margin-bottom: 14px; }
  .sheet label { display: block; font-size: 12.5px; color: var(--hint); margin: 12px 0 5px; }
  .sheet input, .sheet textarea {
    width: 100%; border: none; background: var(--bg2); color: var(--text);
    font: inherit; padding: 11px 12px; border-radius: 10px; outline: none;
  }
  .sheet textarea { min-height: 74px; resize: vertical; }
  .sheet input:focus, .sheet textarea:focus { outline: 2px solid var(--accent); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .chip-row button {
    border: none; background: var(--bg2); color: var(--hint);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip-row button.sel { background: var(--accent); color: var(--accent-text); }
  .art-free { margin-top: 8px; display: none; }
  .art-free.show { display: block; }
  .sheet-link { display: inline-block; margin-top: 6px; color: var(--accent); font-size: 13.5px; }

  .sheet .actions { display: flex; gap: 10px; margin-top: 20px; }
  .sheet .actions button {
    flex: 1; border: none; font: inherit; font-weight: 700;
    padding: 13px; border-radius: 12px; cursor: pointer;
  }
  .btn-save { background: var(--accent); color: var(--accent-text); }
  .btn-del { background: transparent; color: var(--bad); flex: 0 0 auto !important; padding: 13px 16px !important; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--bg2); color: var(--text);
    padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3); white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .gate { padding: 80px 30px; text-align: center; color: var(--hint); line-height: 1.7; }
</style>
</head>
<body>

<header><h1>Bewerbungen</h1></header>

<div class="views">
  <button data-v="liste" class="active">📋</button>
  <button data-v="jobs">🔍 Jobs</button>
  <button data-v="karte">🗺️</button>
  <button data-v="profil">👤</button>
</div>

<!-- Ansicht: Liste -->
<div class="search" id="searchWrap">
  <input id="searchInput" type="search" placeholder="Suchen (Firma oder Ort)">
</div>
<nav id="tabs"></nav>
<main id="list"></main>

<!-- Ansicht: Jobsuche -->
<div id="jobsWrap">
  <div class="job-search">
    <input id="jobQ" placeholder="Beruf (optional)">
    <input id="jobOrt" placeholder="Ort, z.B. Wien">
    <button id="jobGo">Suchen</button>
  </div>
  <div class="chip-row beruf-chips" id="berufChips"></div>
  <div id="jobResults"><div class="empty">Beruf ODER Ort eingeben – nur Ort reicht auch,<br>dann kommt alles was's dort gibt.</div></div>
</div>

<!-- Ansicht: Karte -->
<div id="mapWrap">
  <div class="map-modes">
    <button data-m="bewerbungen" class="active">📋 Meine Bewerbungen</button>
    <button data-m="jobs">🔍 Jobs</button>
  </div>
  <div class="job-search" id="mapJobSearch" style="display:none">
    <input id="mapJobQ" placeholder="Beruf (optional)">
    <input id="mapJobOrt" placeholder="Ort, z.B. Wien">
    <button id="mapJobGo">Suchen</button>
  </div>
  <div id="map"></div>
  <div class="map-hint" id="mapHint"></div>
</div>

<!-- Ansicht: Profil -->
<div id="profilWrap">
  <div class="profil-box">
    <h3>📄 Lebenslauf</h3>
    <p class="profil-hint">Lad deinen Lebenslauf rauf (PDF oder Word) – die KI analysiert ihn und sagt dir ehrlich, was gut ist und was du verbessern sollst.</p>
    <input type="file" id="cvFile" accept=".pdf,.docx" style="display:none">
    <button class="btn-upload" id="cvUploadBtn">📤 Lebenslauf hochladen</button>
    <div class="profil-status" id="cvStatus"></div>
  </div>
  <div class="profil-box" id="analyseBox" style="display:none">
    <h3>🤖 KI-Analyse</h3>
    <div class="analyse-text" id="analyseText"></div>
  </div>
</div>

<button class="fab" id="fab" aria-label="Neue Bewerbung">+</button>

<!-- Job-Detail-Overlay -->
<div class="overlay" id="jobOverlay">
  <div class="sheet" id="jobSheetContent"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <h2 id="sheetTitle">Neue Bewerbung</h2>

    <label for="fFirma">Firma</label>
    <input id="fFirma" placeholder="z.B. Wiener Netze">

    <label for="fOrt">Ort</label>
    <input id="fOrt" placeholder="z.B. Wien">

    <label>Art</label>
    <div class="chip-row" id="fArt"></div>
    <input id="fArtFree" class="art-free" placeholder="z.B. Praktikum, Ferialjob...">

    <label>Status</label>
    <div class="chip-row" id="fStatus"></div>

    <label for="fDatum">Ab wann</label>
    <input id="fDatum" type="date">

    <label for="fNotizen">Notizen</label>
    <textarea id="fNotizen" placeholder="z.B. angerufen, meldet sich nächste Woche"></textarea>
    <a class="sheet-link" id="fLink" href="#" target="_blank" style="display:none">🔗 Job-Inserat ansehen</a>

    <div class="actions">
      <button class="btn-del" id="btnDel" style="display:none">Löschen</button>
      <button class="btn-save" id="btnSave">Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const STATUSES = [
  { key: "alle",      label: "Alle" },
  { key: "gemerkt",   label: "Gemerkt" },
  { key: "beworben",  label: "Beworben" },
  { key: "antwort",   label: "Antwort" },
  { key: "gespraech", label: "Gespräch" },
  { key: "zusage",    label: "Zusage" },
  { key: "absage",    label: "Absage" },
];
const EDIT_STATUSES = STATUSES.slice(1);
const ARTEN = ["Lehre", "Vollzeit", "Teilzeit", "Job", "Anderes"];

let applications = [];
let activeTab = "alle";
let searchTerm = "";
let editingId = null;
let selStatus = "beworben";
let selArt = "Lehre";
let editLink = "";

const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "X-Init-Data": tg.initData,
      ...(options.headers || {}),
    },
  });
  if (res.status === 403) { showGate(); throw new Error("forbidden"); }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || "Fehler " + res.status);
  }
  return res.json();
}

function showGate() {
  document.body.innerHTML =
    '<div class="gate">Kein Zugang.<br>Frag den Admin, dass er deine Telegram-ID freischaltet.</div>';
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `ab ${d}.${m}.${y.slice(2)}`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (m) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* ================= Ansichten ================= */

function showView(v) {
  document.querySelectorAll(".views button").forEach((b) =>
    b.classList.toggle("active", b.dataset.v === v));
  const liste = v === "liste";
  $("searchWrap").style.display = liste ? "" : "none";
  $("tabs").style.display = liste ? "" : "none";
  $("list").style.display = liste ? "" : "none";
  $("fab").style.display = liste ? "" : "none";
  $("jobsWrap").classList.toggle("show", v === "jobs");
  $("mapWrap").classList.toggle("show", v === "karte");
  $("profilWrap").classList.toggle("show", v === "profil");
  if (v === "profil") loadProfile();
  if (v === "karte") {
    renderMap();
    setTimeout(() => map && map.invalidateSize(), 250);
  }
}
document.querySelectorAll(".views button").forEach((b) =>
  b.addEventListener("click", () => showView(b.dataset.v)));

/* ================= Liste ================= */

function matchesSearch(a) {
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  return (a.firma || "").toLowerCase().includes(q)
      || (a.ort || "").toLowerCase().includes(q)
      || (a.art || "").toLowerCase().includes(q);
}

function renderTabs() {
  const base = applications.filter(matchesSearch);
  $("tabs").innerHTML = STATUSES.map((s) => {
    const n = s.key === "alle"
      ? base.length
      : base.filter((a) => a.status === s.key).length;
    return `<button data-tab="${s.key}" class="${s.key === activeTab ? "active" : ""}">
      ${s.label}<span class="n">${n}</span></button>`;
  }).join("");
  $("tabs").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { activeTab = b.dataset.tab; render(); })
  );
}

function renderList() {
  let rows = applications.filter(matchesSearch);
  if (activeTab !== "alle") rows = rows.filter((a) => a.status === activeTab);

  if (!rows.length) {
    $("list").innerHTML = searchTerm
      ? `<div class="empty">Nix gefunden für „${esc(searchTerm)}"</div>`
      : `<div class="empty">Noch nix da.<br>Tipp auf + oder such dir im Jobs-Tab was raus.</div>`;
    return;
  }

  $("list").innerHTML = rows.map((a) => {
    const sub = [a.art, a.ort].filter(Boolean).join(" · ");
    return `
    <div class="card ${a.status}" data-id="${a.id}">
      <div class="top">
        <span class="firma">${esc(a.firma)}</span>
        <span class="datum">${fmtDate(a.datum)}</span>
      </div>
      ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
      ${a.notizen ? `<div class="notiz">${esc(a.notizen)}</div>` : ""}
    </div>`;
  }).join("");

  $("list").querySelectorAll(".card").forEach((c) =>
    c.addEventListener("click", () => openSheet(Number(c.dataset.id)))
  );
}

function render() { renderTabs(); renderList(); }

/* ================= Jobsuche ================= */

const BERUFE = ["Lehre", "Elektro", "Installateur", "Metall", "KFZ", "Lager", "Verkauf", "Gastro", "Bau", "IT", "Reinigung", "Fahrer"];

function renderBerufChips() {
  $("berufChips").innerHTML = BERUFE.map((b) =>
    `<button data-b="${b}">${b}</button>`).join("");
  $("berufChips").querySelectorAll("button").forEach((btn) =>
    btn.addEventListener("click", () => {
      $("jobQ").value = btn.dataset.b;
      searchJobs();
    })
  );
}
renderBerufChips();

let lastJobs = [];
let lastStatusZeile = "";
let lastQ = "", lastOrt = "";

function renderJobResults() {
  if (!lastJobs.length) {
    $("jobResults").innerHTML = `<div class="empty">Keine Treffer.<br><small>${esc(lastStatusZeile)}</small></div>` + deepBtnHtml();
    bindDeepBtn();
    return;
  }
  $("jobResults").innerHTML =
    `<div class="quellen-status">${esc(lastStatusZeile)}</div>` +
    lastJobs.map((j, i) => `
    <div class="jobcard" data-i="${i}">
      <div class="titel">${esc(j.titel)}</div>
      <div class="sub">${[j.firma, j.ort].filter(Boolean).map(esc).join(" · ")}${(j.firma || j.ort) ? " · " : ""}<span class="quelle">${esc(j.quelle || "")}</span></div>
      <div class="row">
        <button class="ansehen details" data-i="${i}">ℹ️ Details</button>
        <button class="merken" data-i="${i}">➕ Merken</button>
      </div>
    </div>`).join("") + deepBtnHtml();
  $("jobResults").querySelectorAll(".merken").forEach((b) =>
    b.addEventListener("click", (e) => { e.stopPropagation(); saveJob(lastJobs[Number(b.dataset.i)], b); }));
  $("jobResults").querySelectorAll(".details").forEach((b) =>
    b.addEventListener("click", (e) => { e.stopPropagation(); openJobSheet(lastJobs[Number(b.dataset.i)]); }));
  $("jobResults").querySelectorAll(".jobcard").forEach((c) =>
    c.addEventListener("click", () => openJobSheet(lastJobs[Number(c.dataset.i)])));
  bindDeepBtn();
}

function deepBtnHtml() {
  return `<button class="deep-btn" id="deepBtn">🤖 KI-Tiefensuche – Zeitungen, Firmenseiten &amp; mehr durchstöbern</button>`;
}
function bindDeepBtn() {
  const b = $("deepBtn");
  if (b) b.addEventListener("click", deepSearch);
}

async function searchJobs() {
  const q = $("jobQ").value.trim();
  const ort = $("jobOrt").value.trim();
  if (!q && !ort) { toast("Beruf oder Ort eingeben"); return; }
  lastQ = q; lastOrt = ort;
  $("jobGo").disabled = true;
  $("jobResults").innerHTML = `<div class="empty">Suche läuft auf karriere.at, AMS, hokify, jobs.at...</div>`;
  try {
    const data = await api(`/api/jobs?q=${encodeURIComponent(q)}&ort=${encodeURIComponent(ort)}`);
    lastJobs = data.jobs || [];
    const quellen = data.quellen || {};
    lastStatusZeile = Object.entries(quellen)
      .map(([name, s]) => s === "fehler" ? `${name} ✗` : `${name}: ${s}`)
      .join(" · ");
    renderJobResults();
    if (lastJobs.length < 5) deepSearch();  // wenig Treffer -> KI automatisch dazu
  } catch (e) {
    $("jobResults").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  } finally {
    $("jobGo").disabled = false;
  }
}

async function deepSearch() {
  const b = $("deepBtn");
  if (b) { b.disabled = true; b.textContent = "🤖 KI durchsucht das Web... (bis zu 1 Minute)"; }
  try {
    const data = await api(`/api/jobs/deep?q=${encodeURIComponent(lastQ)}&ort=${encodeURIComponent(lastOrt)}`);
    const neue = (data.jobs || []).filter((j) =>
      !lastJobs.some((x) => x.link === j.link));
    if (!neue.length) {
      toast("KI hat nix Zusätzliches gefunden");
      if (b) { b.disabled = false; b.textContent = "🤖 Nochmal tiefer suchen"; }
      return;
    }
    lastJobs = [...lastJobs, ...neue];
    lastStatusZeile += (lastStatusZeile ? " · " : "") + `KI: ${neue.length}`;
    renderJobResults();
    toast(`🤖 ${neue.length} zusätzliche Jobs gefunden`);
  } catch (e) {
    toast(e.message);
    if (b) { b.disabled = false; b.textContent = deepBtnText(); }
  }
}
function deepBtnText() { return "🤖 KI-Tiefensuche – Zeitungen, Firmenseiten & mehr durchstöbern"; }

async function saveJob(job, btn) {

/* ================= Karte ================= */

let map = null;
let mapMarkers = [];
let mapMode = "bewerbungen";
let mapJobs = [];
const STATUS_COLORS = {
  gemerkt: "#8b8f9a", beworben: "#5a9cf0", antwort: "#e0a93e",
  gespraech: "#9b6ff0", zusage: "#4caf7d", absage: "#d96a6a",
};
const STATUS_LABELS = {
  gemerkt: "Gemerkt", beworben: "Beworben", antwort: "Antwort",
  gespraech: "Gespräch", zusage: "Zusage", absage: "Absage",
};

function geoCache() {
  try { return JSON.parse(localStorage.getItem("geo") || "{}"); }
  catch { return {}; }
}
function geoCacheSet(key, val) {
  const c = geoCache(); c[key] = val;
  try { localStorage.setItem("geo", JSON.stringify(c)); } catch {}
}

async function geocode(firma, ort) {
  const key = (firma + "|" + (ort || "")).toLowerCase();
  const cached = geoCache()[key];
  if (cached !== undefined) return cached;

  const tryQuery = async (q) => {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(q);
    const res = await fetch(url, { headers: { "Accept-Language": "de" } });
    if (!res.ok) return null;
    const arr = await res.json();
    return arr.length ? { lat: +arr[0].lat, lon: +arr[0].lon, exakt: true } : null;
  };

  let result = await tryQuery(`${firma}, ${ort || "Österreich"}`);
  if (!result && ort) {
    const r = await tryQuery(`${ort}, Österreich`);
    if (r) result = { ...r, exakt: false };
  }
  geoCacheSet(key, result);
  return result;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function renderMap() {
  if (!map) {
    map = L.map("map").setView([47.7, 13.4], 7);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
    }).addTo(map);
  }
  mapMarkers.forEach((m) => map.removeLayer(m));
  mapMarkers = [];
  if (mapMode === "jobs") { renderJobMap(); return; }

  const rows = applications.filter((a) => a.firma);
  if (!rows.length) { $("mapHint").textContent = "Noch keine Bewerbungen eingetragen."; return; }

  let gefunden = 0, offen = rows.length;
  $("mapHint").textContent = "Suche Positionen...";

  for (const a of rows) {
    const cached = geoCache()[(a.firma + "|" + (a.ort || "")).toLowerCase()];
    const pos = cached !== undefined ? cached : await (async () => {
      const p = await geocode(a.firma, a.ort);
      await sleep(1100);
      return p;
    })();
    offen--;
    if (!pos) continue;
    gefunden++;

    const color = STATUS_COLORS[a.status] || "#5a9cf0";
    const marker = L.circleMarker([pos.lat, pos.lon], {
      radius: 9, color, fillColor: color, fillOpacity: 0.85, weight: 2,
    }).addTo(map);
    marker.bindPopup(
      `<b>${esc(a.firma)}</b><br>` +
      [a.art, a.ort].filter(Boolean).map(esc).join(" · ") +
      `<br>Status: ${STATUS_LABELS[a.status] || a.status}` +
      (pos.exakt ? "" : "<br><i>ca. Position (nur Ort gefunden)</i>")
    );
    mapMarkers.push(marker);
    $("mapHint").textContent = offen > 0 ? `Suche Positionen... noch ${offen}` : "";
  }

  if (mapMarkers.length) {
    const group = L.featureGroup(mapMarkers);
    map.fitBounds(group.getBounds().pad(0.25), { maxZoom: 13 });
    $("mapHint").textContent = gefunden < rows.length
      ? `${rows.length - gefunden} Firma(en) nicht gefunden – Ort im Eintrag ergänzen hilft`
      : "";
  } else {
    $("mapHint").textContent = "Keine Position gefunden – trag bei den Bewerbungen einen Ort ein.";
  }
}

/* ---------- Karte: Job-Modus ---------- */

document.querySelectorAll(".map-modes button").forEach((b) =>
  b.addEventListener("click", () => {
    mapMode = b.dataset.m;

async function searchJobsForMap() {
  const q = $("mapJobQ").value.trim();
  const ort = $("mapJobOrt").value.trim();
  if (!q && !ort) { toast("Beruf oder Ort eingeben"); return; }

$("mapJobGo").addEventListener("click", searchJobsForMap);
$("mapJobQ").addEventListener("keydown", (e) => { if (e.key === "Enter") searchJobsForMap(); });
$("mapJobOrt").addEventListener("keydown", (e) => { if (e.key === "Enter") searchJobsForMap(); });

window._mapMerken = async function (idx, btnEl) {
  const j = mapJobs[idx];
  if (!j) return;
  btnEl.disabled = true;
  try {
    await api("/api/applications", {
      method: "POST",
      body: JSON.stringify({
        firma: j.firma || j.titel,
        ort: j.ort || "",
        art: "",
        status: "gemerkt",
        link: j.link || "",
        notizen: j.titel,
        datum: "",
      }),
    });
    tg.HapticFeedback?.notificationOccurred("success");
    btnEl.textContent = "✓ Gemerkt";
    await load();
  } catch (e) {
    toast(e.message);
    btnEl.disabled = false;
  }
};

async function renderJobMap() {
  if (!mapJobs.length) {
    $("mapHint").textContent = "Oben Stichwort eingeben und suchen – Treffer erscheinen als Pins.";
    return;
  }

  // Nach Ort gruppieren, damit jeder Ort nur 1x gesucht werden muss (schneller)
  const ortGruppen = {};
  for (let i = 0; i < mapJobs.length; i++) {
    const j = mapJobs[i];
    const ortKey = (j.ort || "").toLowerCase().trim();
    if (!ortKey) continue;
    (ortGruppen[ortKey] = ortGruppen[ortKey] || []).push(i);
  }

  const orte = Object.keys(ortGruppen);
  if (!orte.length) { $("mapHint").textContent = "Treffer haben keine Ortsangabe."; return; }

  let offen = orte.length;
  $("mapHint").textContent = `Suche Positionen für ${orte.length} Orte...`;

  for (const ortKey of orte) {
    const cacheKey = ("|" + ortKey);
    let pos = geoCache()[cacheKey];
    if (pos === undefined) {
      try {
        const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
          encodeURIComponent(ortKey + ", Österreich");
        const res = await fetch(url, { headers: { "Accept-Language": "de" } });
        const arr = res.ok ? await res.json() : [];
        pos = arr.length ? { lat: +arr[0].lat, lon: +arr[0].lon } : null;
      } catch { pos = null; }
      geoCacheSet(cacheKey, pos);
      await sleep(1100);
    }
    offen--;
    $("mapHint").textContent = offen > 0 ? `Suche Positionen... noch ${offen} Orte` : "";
    if (!pos) continue;

    // Mehrere Jobs am gleichen Ort: leicht versetzen, damit alle antippbar sind
    ortGruppen[ortKey].forEach((idx, n) => {
      const j = mapJobs[idx];
      const jitter = 0.004;
      const lat = pos.lat + (n % 5) * jitter - jitter * 2;
      const lon = pos.lon + Math.floor(n / 5) * jitter;
      const marker = L.circleMarker([lat, lon], {
        radius: 8, color: "#2bb3a3", fillColor: "#2bb3a3", fillOpacity: 0.85, weight: 2,
      }).addTo(map);
      const popupEl = document.createElement("div");
      popupEl.innerHTML =
        `<b>${esc(j.titel)}</b><br>` +
        [j.firma, j.ort].filter(Boolean).map(esc).join(" · ") +
        `<br><span style="font-size:11px;font-weight:700;text-transform:uppercase">${esc(j.quelle || "")}</span><br>` +
        (j.link ? `<a href="${esc(j.link)}" target="_blank">Ansehen</a> ` : "");
      const btn = document.createElement("button");
      btn.className = "popup-merken";
      btn.textContent = "➕ Merken";
      btn.addEventListener("click", () => window._mapMerken(idx, btn));
      popupEl.appendChild(btn);
      marker.bindPopup(popupEl);
      mapMarkers.push(marker);
    });
  }

  if (mapMarkers.length) {
    const group = L.featureGroup(mapMarkers);
    map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 12 });
  } else {
    $("mapHint").textContent = "Positionen nicht gefunden.";
  }
}

/* ================= Sheet ================= */

function renderStatusRow() {
  $("fStatus").innerHTML = EDIT_STATUSES.map((s) =>
    `<button data-s="${s.key}" class="${s.key === selStatus ? "sel" : ""}">${s.label}</button>`
  ).join("");
  $("fStatus").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => { selStatus = b.dataset.s; renderStatusRow(); })
  );
}

function renderArtRow() {
  $("fArt").innerHTML = ARTEN.map((a) =>
    `<button data-a="${a}" class="${a === selArt ? "sel" : ""}">${a}</button>`
  ).join("");
  $("fArt").querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => {
      selArt = b.dataset.a;
      renderArtRow();
      $("fArtFree").classList.toggle("show", selArt === "Anderes");
      if (selArt === "Anderes") $("fArtFree").focus();
    })
  );
  $("fArtFree").classList.toggle("show", selArt === "Anderes");
}

function openSheet(id = null) {
  editingId = id;
  const a = id ? applications.find((x) => x.id === id) : null;
  $("sheetTitle").textContent = a ? a.firma : "Neue Bewerbung";
  $("fFirma").value = a ? a.firma : "";
  $("fOrt").value = a ? (a.ort || "") : "";
  $("fDatum").value = a ? (a.datum || "") : new Date().toISOString().slice(0, 10);
  $("fNotizen").value = a ? (a.notizen || "") : "";
  selStatus = a ? a.status : (activeTab !== "alle" ? activeTab : "beworben");
  editLink = a ? (a.link || "") : "";

  if (editLink) {
    $("fLink").href = editLink;
    $("fLink").style.display = "inline-block";
  } else {
    $("fLink").style.display = "none";
  }

  const savedArt = a ? (a.art || "") : "Lehre";
  if (!savedArt || ARTEN.includes(savedArt)) {
    selArt = savedArt || "Lehre";
    $("fArtFree").value = "";
  } else {
    selArt = "Anderes";
    $("fArtFree").value = savedArt;
  }

  renderStatusRow();
  renderArtRow();
  $("btnDel").style.display = a ? "block" : "none";
  $("overlay").classList.add("open");
}

function closeSheet() { $("overlay").classList.remove("open"); }

async function save() {
  const firma = $("fFirma").value.trim();
  if (!firma) { toast("Firma fehlt"); return; }
  const art = selArt === "Anderes" ? $("fArtFree").value.trim() : selArt;
  const body = {
    firma,
    ort: $("fOrt").value.trim(),
    art,
    status: selStatus,
    link: editLink,
    datum: $("fDatum").value,
    notizen: $("fNotizen").value.trim(),
  };
  try {
    if (editingId) {
      await api(`/api/applications/${editingId}`, { method: "PUT", body: JSON.stringify(body) });
    } else {
      await api("/api/applications", { method: "POST", body: JSON.stringify(body) });
    }
    tg.HapticFeedback?.notificationOccurred("success");
    closeSheet();
    await load();
    toast("Gespeichert");
  } catch (e) { toast(e.message); }
}

async function del() {
  if (!editingId) return;
  try {
    await api(`/api/applications/${editingId}`, { method: "DELETE" });
    closeSheet();
    await load();
    toast("Gelöscht");
  } catch (e) { toast(e.message); }
}

/* ================= Job-Details + Bewerben ================= */

let currentDetailJob = null;

function openJobSheet(j) {
  currentDetailJob = j;
  $("jobSheetContent").innerHTML =
    `<h2>${esc(j.titel)}</h2>` +
    `<div class="detail-sub">${[j.firma, j.ort, j.quelle].filter(Boolean).map(esc).join(" · ")}</div>` +
    `<div class="detail-text">🤖 KI liest das Inserat und fasst zusammen...</div>` +
    detailActionsHtml(j, "");
  bindDetailActions(j, "");
  $("jobOverlay").classList.add("open");
  loadJobDetails(j);
}

function detailActionsHtml(j, email) {
  return `<div class="detail-actions">` +
    (email ? `<button class="da-bewerben" id="daBewerben">✉️ Bewerben (${esc(email)})</button>` : "") +
    (j.link ? `<a class="da-ansehen" href="${esc(j.link)}" target="_blank">🔗 Inserat öffnen${email ? "" : " &amp; dort bewerben"}</a>` : "") +
    `<button class="da-merken" id="daMerken">➕ In Tracker merken</button>` +
    `</div>`;
}

function bindDetailActions(j, email) {
  const bw = $("daBewerben");
  if (bw) bw.addEventListener("click", () => {
    const subject = encodeURIComponent(`Bewerbung: ${j.titel}`);
    window.location.href = `mailto:${email}?subject=${subject}`;
  });
  const mk = $("daMerken");
  if (mk) mk.addEventListener("click", () => saveJob(j, mk));
}

async function loadJobDetails(j) {
  if (!j.link) {
    $("jobSheetContent").querySelector(".detail-text").textContent = "Kein Link vorhanden – Details können nicht geladen werden.";
    return;
  }
  try {
    const d = await api(`/api/jobs/details?link=${encodeURIComponent(j.link)}`);
    if (currentDetailJob !== j) return;
    const email = (d.email || "").includes("@") ? d.email : "";
    $("jobSheetContent").innerHTML =
      `<h2>${esc(j.titel)}</h2>` +
      `<div class="detail-sub">${[j.firma, j.ort, j.quelle].filter(Boolean).map(esc).join(" · ")}</div>` +
      `<div class="detail-text">${esc(d.zusammenfassung || "Keine Zusammenfassung verfügbar.")}</div>` +
      detailActionsHtml(j, email);
    bindDetailActions(j, email);
  } catch (e) {
    if (currentDetailJob !== j) return;
    const dt = $("jobSheetContent").querySelector(".detail-text");
    if (dt) dt.textContent = "Details konnten nicht geladen werden (" + e.message + ") – über den Link unten kommst du trotzdem zum Inserat.";
  }
}

$("jobOverlay").addEventListener("click", (e) => {
  if (e.target === $("jobOverlay")) $("jobOverlay").classList.remove("open");
});

/* ================= Profil / Lebenslauf ================= */

let profilGeladen = false;

async function loadProfile() {
  if (profilGeladen) return;
  try {
    const p = await api("/api/profile");
    if (p.analyse) {
      $("cvStatus").textContent = `📄 ${p.dateiname} (${p.datum})`;
      $("analyseText").textContent = p.analyse;
      $("analyseBox").style.display = "block";
    }
    profilGeladen = true;
  } catch (e) { /* still zeigen */ }
}

$("cvUploadBtn").addEventListener("click", () => $("cvFile").click());

$("cvFile").addEventListener("change", async () => {
  const file = $("cvFile").files[0];
  if (!file) return;
  $("cvUploadBtn").disabled = true;
  $("cvUploadBtn").textContent = "🤖 KI analysiert deinen Lebenslauf...";
  $("cvStatus").textContent = "Kann bis zu 30 Sekunden dauern.";
  try {
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch("/api/profile/cv", {
      method: "POST",
      headers: { "X-Init-Data": tg.initData },
      body: fd,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Fehler " + res.status);
    }
    const d = await res.json();
    $("cvStatus").textContent = `📄 ${d.dateiname} (${d.datum})`;
    $("analyseText").textContent = d.analyse;
    $("analyseBox").style.display = "block";
    tg.HapticFeedback?.notificationOccurred("success");
    toast("Analyse fertig");
  } catch (e) {
    $("cvStatus").textContent = e.message;
  } finally {
    $("cvUploadBtn").disabled = false;
    $("cvUploadBtn").textContent = "📤 Lebenslauf hochladen";
    $("cvFile").value = "";
  }
});

/* ================= Start ================= */

async function load() {
  applications = await api("/api/applications");
  render();
}

$("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim();
  render();
});
$("fab").addEventListener("click", () => openSheet(null));
$("btnSave").addEventListener("click", save);
$("btnDel").addEventListener("click", del);
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeSheet(); });

load().catch((e) => { if (e.message !== "forbidden") toast(e.message); });
